stages:
  - validate
  - package
  - deploy

default:
  interruptible: true

variables:
  PNPM_STORE_DIR: .pnpm-store
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

validate:
  stage: validate
  image: node:22-bookworm
  before_script:
    - corepack enable
    - corepack pnpm config set store-dir "$PNPM_STORE_DIR"
    - corepack pnpm install --frozen-lockfile
  script:
    - corepack pnpm run typecheck:server
    - corepack pnpm test
    - corepack pnpm run build:server
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - apps/server/dist/
      - packages/shared/dist/
      - packages/runner/dist/

package:server:
  stage: package
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command:
        - --tls=false
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  rules:
    - if: $CI_COMMIT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - export IMAGE_NAME="$CI_REGISTRY_IMAGE/server"
    - export RUNNER_IMAGE_NAME="$CI_REGISTRY_IMAGE/runner"
    - docker build --pull -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -t "$IMAGE_NAME:$CI_COMMIT_REF_SLUG" .
    - docker build --pull -f Dockerfile.runner -t "$RUNNER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -t "$RUNNER_IMAGE_NAME:$CI_COMMIT_REF_SLUG" .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - docker push "$RUNNER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$RUNNER_IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:latest"
        docker tag "$RUNNER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$RUNNER_IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
        docker push "$RUNNER_IMAGE_NAME:latest"
      fi

deploy:server:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: package:server
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST && $DEPLOY_USER && $DEPLOY_PATH && $DEPLOY_SSH_PRIVATE_KEY'
      when: manual
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - printf "%s" "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - export IMAGE_NAME="$CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHORT_SHA"
    - export RUNNER_IMAGE_NAME="$CI_REGISTRY_IMAGE/runner:$CI_COMMIT_SHORT_SHA"
    - export REGISTRY_USER="${DEPLOY_REGISTRY_USER:-$CI_REGISTRY_USER}"
    - export REGISTRY_PASSWORD="${DEPLOY_REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - |
      cat > deploy.env <<EOF
      TS_PLAYWRIGHT_IMAGE=$IMAGE_NAME
      APP_PORT=${DEPLOY_APP_PORT:-8000}
      APP_API_KEY=${DEPLOY_APP_API_KEY}
      APP_OTP_AUTOREPLACE=${DEPLOY_APP_OTP_AUTOREPLACE:-false}
      APP_RUN_TIMEOUT_MS=${DEPLOY_APP_RUN_TIMEOUT_MS:-900000}
      APP_PLAYWRIGHT_DEFAULT_TIMEOUT_MS=${DEPLOY_APP_PLAYWRIGHT_DEFAULT_TIMEOUT_MS:-60000}
      APP_DOCKER_IMAGE=${DEPLOY_APP_DOCKER_IMAGE:-$RUNNER_IMAGE_NAME}
      APP_DOCKER_RUNNER_MODE=${DEPLOY_APP_DOCKER_RUNNER_MODE:-global}
      APP_DOCKER_WORKSPACE_TRANSPORT=${DEPLOY_APP_DOCKER_WORKSPACE_TRANSPORT:-auto}
      APP_DOCKER_SHM_SIZE=${DEPLOY_APP_DOCKER_SHM_SIZE:-2g}
      APP_DOCKER_IPC=${DEPLOY_APP_DOCKER_IPC}
      APP_DOCKER_NETWORK=${DEPLOY_APP_DOCKER_NETWORK}
      APP_DOCKER_ADD_HOSTS=${DEPLOY_APP_DOCKER_ADD_HOSTS}
      EOF
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
    - scp deploy/docker-compose.gitlab.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
    - scp deploy.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        echo '$REGISTRY_PASSWORD' | docker login '$CI_REGISTRY' --username '$REGISTRY_USER' --password-stdin &&
        docker pull '$RUNNER_IMAGE_NAME' &&
        cd '$DEPLOY_PATH' &&
        docker compose pull &&
        docker compose up -d
      "
  environment:
    name: production
