<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src *;" />
    <title>Playwright Agent</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <h1>Playwright Agent</h1>
          <p>TypeScript recorder for Playwright Test scenarios.</p>
        </div>
        <div class="status">
          <span>Status</span>
          <strong id="runtime-status">Idle</strong>
        </div>
      </header>

      <main class="grid">
        <section class="panel form-panel">
          <div class="field-grid">
            <label>
              <span>Project</span>
              <select id="project-select"></select>
            </label>
            <label>
              <span>Environment</span>
              <select id="env-select"></select>
            </label>
            <label>
              <span>Scenario Name</span>
              <input id="scenario-name" type="text" value="New Scenario" />
            </label>
            <label>
              <span>Folder</span>
              <input id="folder-path" type="text" placeholder="optional/path" />
            </label>
            <label class="full">
              <span>Start URL</span>
              <input id="start-url" type="text" placeholder="https://example.com" />
            </label>
          </div>

          <div class="toolbar">
            <button id="refresh-btn">Refresh</button>
            <button id="record-btn">Record</button>
            <button id="stop-btn">Stop</button>
            <button id="preview-btn">Preview</button>
            <button id="apply-btn">Apply</button>
            <button id="replay-btn">Replay</button>
            <button id="upload-btn">Upload</button>
          </div>

          <label class="checkbox-row">
            <input id="save-auth" type="checkbox" />
            <span>Save auth state</span>
          </label>

          <div class="paths">
            <div><span>Current File</span><code id="current-file">-</code></div>
            <div><span>Prepared Zip</span><code id="prepared-zip">-</code></div>
          </div>
        </section>

        <section class="panel">
          <div class="section-header">
            <h2>Outputs</h2>
          </div>
          <div class="mini-grid">
            <input id="output-key" type="text" placeholder="key" />
            <input id="output-selector" type="text" placeholder="selector" />
            <select id="output-mode">
              <option value="text">text</option>
              <option value="value">value</option>
              <option value="attr">attr</option>
            </select>
            <input id="output-attr" type="text" placeholder="attr" />
            <input id="output-frame" type="text" placeholder="frame (optional)" />
            <input id="output-timeout" type="number" placeholder="timeout ms" />
            <button id="add-output-btn">Add output</button>
            <button id="remove-output-btn" class="secondary">Remove selected</button>
          </div>
          <table id="output-table">
            <thead>
              <tr>
                <th></th>
                <th>Key</th>
                <th>Selector</th>
                <th>Mode</th>
                <th>Attr</th>
                <th>Frame</th>
                <th>Timeout</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="panel">
          <div class="section-header">
            <h2>Input Variables</h2>
          </div>
          <div class="mini-grid">
            <select id="input-type">
              <option value="string">string</option>
              <option value="2fa_otp">2fa_otp</option>
            </select>
            <input id="input-name" type="text" placeholder="name" />
            <input id="input-description" type="text" placeholder="description" />
            <select id="input-account"></select>
            <button id="add-input-btn">Add input</button>
            <button id="remove-input-btn" class="secondary">Remove selected</button>
            <button id="insert-input-btn">Insert placeholder</button>
            <button id="insert-otp-btn">Insert 2FA OTP</button>
          </div>
          <table id="input-table">
            <thead>
              <tr>
                <th></th>
                <th>Type</th>
                <th>Name</th>
                <th>Description</th>
                <th>OTP account</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="panel">
          <div class="section-header">
            <h2>Server OTP Accounts</h2>
          </div>
          <div class="mini-grid">
            <input id="otp-login" type="text" placeholder="login" />
            <input id="otp-secret" type="password" placeholder="secret" />
            <button id="otp-refresh-btn">Refresh</button>
            <button id="otp-save-btn">Save</button>
            <button id="otp-delete-btn" class="danger">Delete</button>
          </div>
          <table id="otp-table">
            <thead>
              <tr>
                <th></th>
                <th>Login</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="panel editor-panel">
          <div class="section-header">
            <h2>Scenario Editor</h2>
            <span id="editor-dirty" class="muted">saved</span>
          </div>
          <textarea id="editor" spellcheck="false"></textarea>
        </section>
      </main>
    </div>
    <script src="./renderer.js"></script>
  </body>
  </html>
